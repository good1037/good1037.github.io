<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>滇之行｜暑期支教之旅</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/bundled/lenis.min.js"></script>

<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: {
        playfair: ['"Playfair Display"', 'serif']
      }
    }
  }
}
</script>

<style>
body { background:#000; color:#fff; margin:0; overflow-x:hidden; }
img { display:block; }
</style>
</head>
<body>

<!-- Hero 全屏区域 -->
<section class="h-screen w-full flex flex-col justify-center items-center px-6 relative">
  <div id="hero-title" class="font-playfair text-5xl md:text-7xl lg:text-8xl tracking-wide">滇之行</div>
  <div id="hero-sub" class="mt-4 text-md md:text-xl text-white/70 tracking-widest">暑期支教之旅</div>
  <div id="scroll-hint" class="absolute bottom-10">
    <div class="w-px h-14 bg-white/30 mx-auto"></div>
    <p class="text-xs text-white/40 text-center mt-2 tracking-widest">SCROLL</p>
  </div>
</section>

<!-- 主分屏区域 -->
<section id="scroll-wrap" class="h-screen w-full flex overflow-hidden">
  <!-- 左侧章节索引 -->
  <div class="w-1/3 h-full flex flex-col justify-center px-8 md:px-16 border-r border-white/10">
    <div id="chapter-list" class="space-y-8 md:space-y-12"></div>
  </div>

  <!-- 右侧横向滚动图片容器 -->
  <div id="gallery-viewport" class="w-2/3 h-full overflow-hidden flex items-center">
    <div id="horizontal-track" class="flex gap-6 md:gap-8 pl-4 items-center"></div>
  </div>
</section>

<!-- 结尾页 -->
<footer class="min-h-screen bg-black flex flex-col justify-center items-center px-6">
  <p class="font-playfair text-3xl md:text-5xl text-white/80">End of Journal</p>
  <p class="mt-4 text-white/40 tracking-widest">YUNNAN SUMMER VOLUNTEER TRIP</p>
</footer>


<script>
gsap.registerPlugin(ScrollTrigger);

// ========== 你的图片直链填这里 ==========
const chapters = [
  {
    id: "shuangbai",
    label: "01 双柏",
    title: "山野与晚风",
    images: [
      "https://tuchuang.voooe.cn/images/2026/09/02/3b21aa5acd44be9e3ee13a419b2834ad.jpg",
      "你的图片链接2",
      "你的图片链接3",
      "你的图片链接4"
    ]
  },
  {
    id: "tuodian",
    label: "02 妥甸",
    title: "支教日常",
    images: [
      "你的图片链接5",
      "你的图片链接6",
      "你的图片链接7",
      "你的图片链接8"
    ]
  },
  {
    id: "return",
    label: "03 归途",
    title: "云边回望",
    images: [
      "你的图片链接9",
      "你的图片链接10",
      "你的图片链接11"
    ]
  }
];

let activeChapterIndex = 0;
const chapterListEl = document.getElementById('chapter-list');
const horizontalTrackEl = document.getElementById('horizontal-track');

// 渲染左侧章节
chapters.forEach((ch, idx) => {
  const div = document.createElement('div');
  div.className = "cursor-pointer group chapter-item transition-all duration-300";
  div.dataset.index = idx;
  div.innerHTML = `
    <div class="font-playfair">
      <div class="text-sm tracking-widest text-white/50">${ch.label}</div>
      <h2 class="text-2xl md:text-4xl mt-1 group-hover:text-white transition-colors">${ch.title}</h2>
    </div>
  `;
  chapterListEl.appendChild(div);
});

// 渲染右侧图片卡片（先不设 src，等加载控制）
const allImages = [];
chapters.forEach(ch => {
  ch.images.forEach(imgSrc => {
    const card = document.createElement('div');
    card.className = "w-[280px] md:w-[420px] h-[65vh] flex-shrink-0 overflow-hidden rounded-sm bg-white/5";
    const img = document.createElement('img');
    img.src = imgSrc;
    img.alt = "photo";
    img.className = "w-full h-full object-cover transition-transform duration-500 hover:scale-105";
    img.loading = "lazy";
    img.onerror = function() {
      console.warn("图片加载失败:", imgSrc);
      this.parentElement.style.background = "#333";
    };
    card.appendChild(img);
    horizontalTrackEl.appendChild(card);
    allImages.push(img);
  });
});

// Hero 入场动画
gsap.from("#hero-title", {opacity:0, y:30, duration:1.2});
gsap.from("#hero-sub", {opacity:0, delay:0.6, duration:1});
gsap.from("#scroll-hint", {opacity:0, delay:1.2, duration:1});

// Lenis 平滑滚动 + 与 ScrollTrigger 联动（关键修复！）
const lenis = new Lenis({
  duration: 1.4,
  easing: t => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
  smoothWheel: true
});

// 把 Lenis 的滚动事件同步给 ScrollTrigger
lenis.on('scroll', ScrollTrigger.update);

// 用 gsap.ticker 驱动 Lenis（而不是 requestAnimationFrame）
gsap.ticker.add((time) => {
  lenis.raf(time * 1000);
});
gsap.ticker.lagSmoothing(0);

// 等所有图片加载完成后再初始化横向滚动（关键修复！）
function initHorizontalScroll() {
  const scrollWrap = document.getElementById("scroll-wrap");
  const track = document.getElementById("horizontal-track");
  const viewport = document.getElementById("gallery-viewport");

  // 用右侧容器的实际宽度计算，而不是 window.innerWidth * 0.66
  const scrollLength = track.scrollWidth - viewport.clientWidth;

  if (scrollLength <= 0) {
    console.warn("滚动距离为0，图片可能未加载或数量不足");
    return;
  }

  const tl = gsap.timeline({
    scrollTrigger: {
      trigger: scrollWrap,
      pin: true,
      scrub: 1,
      end: `+=${scrollLength}`,
      onUpdate: self => {
        const progress = self.progress;
        activeChapterIndex = Math.min(
          chapters.length - 1,
          Math.floor(progress * chapters.length)
        );
        updateChapterHighlight();
      }
    }
  });

  tl.to(track, { x: -scrollLength, ease: "none" });

  // 初始高亮
  updateChapterHighlight();
}

function updateChapterHighlight() {
  const items = document.querySelectorAll(".chapter-item");
  items.forEach((el, idx) => {
    if (idx === activeChapterIndex) {
      gsap.to(el, { opacity: 1, x: 8, duration: 0.4 });
    } else {
      gsap.to(el, { opacity: 0.35, x: 0, duration: 0.4 });
    }
  });
}

// 等待图片加载（最多等5秒，防止某张图卡死）
let loadedCount = 0;
const totalImages = allImages.length;
const timeoutMs = 5000;
const startTime = Date.now();

function checkAllLoaded() {
  loadedCount++;
  if (loadedCount >= totalImages || Date.now() - startTime > timeoutMs) {
    initHorizontalScroll();
    return true;
  }
  return false;
}

allImages.forEach(img => {
  if (img.complete) {
    checkAllLoaded();
  } else {
    img.onload = checkAllLoaded;
    img.onerror = checkAllLoaded; // 加载失败也继续，不阻塞初始化
  }
});

// 兜底：5秒后无论如何都初始化
setTimeout(() => {
  if (loadedCount < totalImages) {
    console.warn("部分图片未加载完成，强制初始化");
    initHorizontalScroll();
  }
}, timeoutMs);

// 窗口大小变化时刷新
window.addEventListener('resize', () => {
  ScrollTrigger.refresh();
});
</script>
</body>
</html>
